<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GroceryPOS - Login</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-card h2 { margin-bottom: 25px; color: #333; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        .btn-login { width: 100%; padding: 12px; background-color: #6B46C1; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-login:hover { background-color: #553C9A; }
        .error-msg { color: #e53e3e; background-color: #fff5f5; border: 1px solid #feb2b2; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-size: 14px; }
        .demo-credentials { margin-top: 25px; font-size: 13px; color: #718096; background: #edf2f7; padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>
<div class="login-card">
    <h2>GroceryPOS Login</h2>
    <div th:if="${errorMessage}" class="error-msg" th:text="${errorMessage}"></div>
    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="btn-login">Login to POS</button>
    </form>
    <div class="demo-credentials">
        <strong>Default Credentials:</strong><br>
        Username: <code>admin</code> | Password: <code>admin123</code>
    </div>
</div>
</body>
</html>
